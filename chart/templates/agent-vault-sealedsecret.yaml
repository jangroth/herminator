{{- if .Values.agentVault.encryptedHttpsProxy }}
# Agent Vault proxy URL, carrying the session token. Ciphertext from:
#   kubeseal --namespace {{ .Values.namespace }} --name hermes-agent-vault --raw \
#     --from-file=HTTPS_PROXY=<(printf '%s' "<proxy url>")
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: hermes-agent-vault
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: hermes
spec:
  template:
    metadata:
      name: hermes-agent-vault
      namespace: {{ .Values.namespace }}
    type: Opaque
  encryptedData:
    HTTPS_PROXY: {{ .Values.agentVault.encryptedHttpsProxy | quote }}
{{- end }}
