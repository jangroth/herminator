# Real credentials (Tailscale auth key, API_SERVER_KEY) — sealed via sealed-secrets
# (running in kube-system), never plaintext in git. See DECISIONS.md #007 and the
# second-pass revision in Spec 001. Ciphertext populated at deploy time with:
#   kubeseal --namespace {{ .Values.namespace }} --name hermes-secrets --raw \
#     --from-file=<key>=<(printf '%s' "<value>")
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: hermes-secrets
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: hermes
spec:
  template:
    metadata:
      name: hermes-secrets
      namespace: {{ .Values.namespace }}
    type: Opaque
  encryptedData:
    API_SERVER_KEY: {{ .Values.sealedSecret.encryptedApiServerKey | quote }}
    TS_AUTHKEY: {{ .Values.sealedSecret.encryptedTsAuthKey | quote }}
