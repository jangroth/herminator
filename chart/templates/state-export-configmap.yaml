apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-state-export
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: hermes
data:
  run.sh: |
{{ .Files.Get "files/state-export/run.sh" | indent 4 }}
  export.sh: |
{{ .Files.Get "files/state-export/export.sh" | indent 4 }}
  overview.py: |
{{ .Files.Get "files/state-export/overview.py" | indent 4 }}
  metrics.py: |
{{ .Files.Get "files/state-export/metrics.py" | indent 4 }}
  # GitHub's published SSH host keys (api.github.com/meta).
  known_hosts: |
{{ .Files.Get "files/state-export/known_hosts" | indent 4 }}
