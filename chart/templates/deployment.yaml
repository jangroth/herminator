apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: hermes
spec:
  replicas: 1
  # RWO Longhorn volume: RollingUpdate deadlocks waiting for the old pod to release
  # it, and hermes is single-instance by design (sqlite + lockfiles) anyway.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes
    spec:
      serviceAccountName: hermes
      # Aperture's MagicDNS name doesn't resolve in-pod — the tailscale sidecar
      # shares pod routes/tailscale0 but not /etc/resolv.conf (Constraint A).
      hostAliases:
        - ip: {{ .Values.aperture.tailnetIp }}
          hostnames:
            - {{ .Values.aperture.baseUrl | trimPrefix "http://" | trimSuffix "/v1" }}

      initContainers:
        # Combined CA bundle (system store + homekube-ca) for Python-side TLS
        # clients (SSL_CERT_FILE/REQUESTS_CA_BUNDLE fully override rather than
        # extend — see Constraint C comment below and DECISIONS.md #010).
        - name: build-ca-bundle
          image: "{{ .Values.image.repository }}:{{ required "image.tag must be set (pinned in homekube-apps)" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - cat /etc/ssl/certs/ca-certificates.crt /etc/ssl/certs/homekube/homekube-ca.crt > /ca-bundle/ca-bundle.crt
          volumeMounts:
            - name: ca-cert
              mountPath: /etc/ssl/certs/homekube
              readOnly: true
            - name: ca-bundle
              mountPath: /ca-bundle

        # Seed config.yaml onto the PVC once; hermes owns and rewrites it after that.
        - name: seed-config
          image: "{{ .Values.image.repository }}:{{ required "image.tag must be set (pinned in homekube-apps)" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - '[ -s /opt/data/config.yaml ] || { cp /seed/config.yaml /opt/data/config.yaml && chown 1000:1000 /opt/data/config.yaml; }'
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: config
              mountPath: /seed
              readOnly: true

        - name: copy-betterleaks
          image: "{{ .Values.stateExport.betterleaks.image }}:{{ required "stateExport.betterleaks.tag must be set (pinned in homekube-apps)" .Values.stateExport.betterleaks.tag }}"
          command: ["cp", "/usr/bin/betterleaks", "/tools/betterleaks"]
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: state-export-tools
              mountPath: /tools

        # The image's hermes user is uid 10000 with home /opt/data; only the
        # entrypoint remaps it. ssh needs a passwd entry for uid 1000, and its
        # home must not be the Hermes-writable PVC.
        - name: state-export-passwd
          image: "{{ .Values.image.repository }}:{{ required "image.tag must be set (pinned in homekube-apps)" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - sed 's#^hermes:.*#hermes:x:1000:1000::/work/home:/bin/sh#' /etc/passwd > /etc-export/passwd
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: state-export-etc
              mountPath: /etc-export

      containers:
        - name: hermes
          image: "{{ .Values.image.repository }}:{{ required "image.tag must be set (pinned in homekube-apps)" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # args, not command — the image's ENTRYPOINT dispatcher must stay in place.
          args: ["gateway", "run"]
          env:
            - name: HERMES_UID
              value: "1000"
            - name: HERMES_GID
              value: "1000"
            - name: HERMES_DASHBOARD
              value: "1"
            # Non-loopback bind engages the Dex OAuth gate (Decision 001); nginx
            # remains the only externally exposed front door (Constraint B).
            - name: HERMES_DASHBOARD_HOST
              value: "0.0.0.0"
            - name: HERMES_DASHBOARD_PORT
              value: "9119"
            - name: API_SERVER_ENABLED
              value: "true"
            - name: API_SERVER_HOST
              value: "0.0.0.0"
            - name: API_SERVER_PORT
              value: "8642"
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: API_SERVER_KEY
            # CA trust for the OIDC back-channel to Dex (Constraint C). The three
            # vars are NOT equivalent: NODE_EXTRA_CA_CERTS extends Node's trust
            # store, but SSL_CERT_FILE/REQUESTS_CA_BUNDLE fully *replace* the
            # Python-side default (dropping the system CA store), which broke
            # every non-Dex Python-backed egress (e.g. Telegram, issue #2).
            # Those two point at a combined bundle instead; NODE_EXTRA_CA_CERTS
            # can stay pointed at homekube-ca alone since it only adds to what's
            # already trusted. See DECISIONS.md #010.
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/ssl/certs/homekube/homekube-ca.crt
            - name: SSL_CERT_FILE
              value: /etc/ssl/certs/homekube-bundle/ca-bundle.crt
            - name: REQUESTS_CA_BUNDLE
              value: /etc/ssl/certs/homekube-bundle/ca-bundle.crt
          ports:
            - name: gateway
              containerPort: 8642
            - name: dashboard
              containerPort: 9119
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: ca-cert
              mountPath: /etc/ssl/certs/homekube
              readOnly: true
            - name: ca-bundle
              mountPath: /etc/ssl/certs/homekube-bundle
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 8642
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8642
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources.hermes | nindent 12 }}

        - name: nginx
          image: nginx:stable
          ports:
            - name: https
              containerPort: 443
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: tls
              mountPath: /etc/nginx/tls
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 443
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 443
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources.nginx | nindent 12 }}

        - name: tailscale
          image: "{{ .Values.tailscale.image }}:{{ required "tailscale.tag must be set (pinned in homekube-apps)" .Values.tailscale.tag }}"
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: TS_AUTHKEY
            - name: TS_KUBE_SECRET
              value: {{ .Values.tailscale.stateSecretName }}
            - name: TS_HOSTNAME
              value: {{ .Values.tailscale.hostname }}
            # containerboot defaults to userspace mode, which would break
            # transparent outbound routing this whole setup relies on.
            - name: TS_USERSPACE
              value: "false"
            # Inbound-closed: the sidecar only ever needs outbound to Aperture.
            # Never add --accept-routes here — it would hairpin in-pod traffic to
            # the 192.168.86.240/28 VIPs (including Dex) out over the tailnet.
            - name: TS_EXTRA_ARGS
              value: "--shields-up"
          # Replies to tailnet-sourced VIP clients must return via Cilium (eth0),
          # not the sidecar's tailscale0 — pod-sourced traffic bypasses table 52.
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - "ip rule del pref 5000 2>/dev/null; ip rule add pref 5000 from {{ .Values.podCidr }} lookup main"
          volumeMounts:
            - name: dev-net-tun
              mountPath: /dev/net/tun
          resources:
            {{- toYaml .Values.resources.tailscale | nindent 12 }}

        # The only container with the deploy key. Hermes must never mount
        # state-export-key, and shareProcessNamespace must stay unset, or Hermes
        # could reach the key through /proc.
        - name: state-export
          image: "{{ .Values.image.repository }}:{{ required "image.tag must be set (pinned in homekube-apps)" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["bash", "/etc/state-export/run.sh"]
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            # The image's PATH includes /opt/data/.local/bin, which Hermes can write.
            - name: PATH
              value: /usr/local/bin:/usr/bin:/bin
            - name: HOME
              value: /work/home
            - name: STATE_EXPORT_REMOTE
              value: {{ .Values.stateExport.remote | quote }}
            - name: STATE_EXPORT_BRANCH
              value: {{ .Values.stateExport.branch | quote }}
            - name: STATE_EXPORT_INTERVAL
              value: {{ .Values.stateExport.intervalSeconds | quote }}
            - name: STATE_EXPORT_PATHS
              value: {{ join "\n" .Values.stateExport.paths | quote }}
            - name: HERMES_IMAGE_TAG
              value: {{ .Values.image.tag | quote }}
            - name: STATE_EXPORT_KEY_SOURCE
              value: /etc/state-export-key/id_ed25519
            - name: STATE_EXPORT_KEY
              value: /work/ssh/id_ed25519
            - name: GIT_SSH_COMMAND
              value: "ssh -F /dev/null -i /work/ssh/id_ed25519 -o IdentitiesOnly=yes -o UserKnownHostsFile=/etc/state-export/known_hosts -o StrictHostKeyChecking=yes"
          volumeMounts:
            - name: data
              mountPath: /opt/data
              readOnly: true
            - name: state-export-config
              mountPath: /etc/state-export
              readOnly: true
            - name: state-export-key
              mountPath: /etc/state-export-key
              readOnly: true
            - name: state-export-etc
              mountPath: /etc/passwd
              subPath: passwd
              readOnly: true
            - name: state-export-ssh
              mountPath: /work/ssh
            - name: state-export-tools
              mountPath: /tools
              readOnly: true
            - name: state-export-work
              mountPath: /work
          resources:
            {{- toYaml .Values.resources.stateExport | nindent 12 }}

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
        - name: config
          configMap:
            name: hermes-config
        - name: ca-cert
          configMap:
            name: hermes-config
            items:
              - key: homekube-ca.crt
                path: homekube-ca.crt
        - name: ca-bundle
          emptyDir: {}
        - name: tls
          secret:
            secretName: hermes-tls
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: state-export-config
          configMap:
            name: hermes-state-export
        # Root-owned without fsGroup (which would chown the whole PVC), hence
        # world-readable; run.sh copies it to state-export-ssh as 0600.
        - name: state-export-key
          secret:
            secretName: hermes-secrets
            defaultMode: 0444
            items:
              - key: STATE_EXPORT_SSH_KEY
                path: id_ed25519
        - name: state-export-ssh
          emptyDir:
            medium: Memory
        - name: state-export-tools
          emptyDir: {}
        - name: state-export-etc
          emptyDir: {}
        - name: state-export-work
          emptyDir: {}
