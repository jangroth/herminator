apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: hermes
---
# Pre-created empty state Secret for the tailscale sidecar (TS_STATE=kube:<name>).
# RBAC resourceNames can't constrain the `create` verb, so a scoped Role can never
# let tailscaled create this at runtime (Spec 001, second-pass revision) — the
# chart creates it empty and the Role below only ever get/update/patches it.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.tailscale.stateSecretName }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: hermes
type: Opaque
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hermes-tailscale-state
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: hermes
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.tailscale.stateSecretName | quote }}]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hermes-tailscale-state
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: hermes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hermes-tailscale-state
subjects:
  - kind: ServiceAccount
    name: hermes
    namespace: {{ .Values.namespace }}
