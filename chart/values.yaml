image:
  repository: nousresearch/hermes-agent
  tag: ""
  pullPolicy: IfNotPresent

namespace: hermes

vip: 192.168.86.246

# Cluster pod network (kubeadm ClusterConfiguration).
podCidr: 10.244.0.0/16

dashboard:
  # Workaround for https://github.com/NousResearch/hermes-agent/issues/42780 —
  # set directly in config.yaml rather than relying on HERMES_DASHBOARD_PUBLIC_URL.
  publicUrl: https://192.168.86.246

oidc:
  issuer: https://pi0.taild13083.ts.net/dex
  # hermes's self-hosted OIDC is a public PKCE client — no client secret exists in
  # this flow (corrects Spec 001's Decision 4 assumption; see DECISIONS.md). The Dex
  # static client must be registered `public: true`, no `secret:` field.
  clientId: hermes

# homekube's internal CA (ClusterIssuer/homekube-ca). Public cert, not a secret.
# hermes's OIDC discovery/token exchange against Dex needs to trust this to avoid
# x509 errors (Spec 001, Constraint C) — same problem/fix as Homepage's ArgoCD widget.
# Source: `kubectl get secret homekube-ca-secret -n cert-manager -o jsonpath='{.data.ca\.crt}' | base64 -d`
caCert: |
  -----BEGIN CERTIFICATE-----
  MIIBcDCCARagAwIBAgIUSf9VR+890wUgUZ1h8wCRr6GA7uwwCgYIKoZIzj0EAwIw
  FjEUMBIGA1UEAxMLaG9tZWt1YmUtY2EwHhcNMjYwNjE3MDQ1MDMyWhcNMzYwNjE0
  MDQ1MDMyWjAWMRQwEgYDVQQDEwtob21la3ViZS1jYTBZMBMGByqGSM49AgEGCCqG
  SM49AwEHA0IABPQeFiJdqorOUyttROs9KRaYAijiazWfsBPVVa7xrBgihA/pY3mK
  Is4OXPgh7XIxFszEj6B3Waq7sVtveJuwGU2jQjBAMA4GA1UdDwEB/wQEAwICpDAP
  BgNVHRMBAf8EBTADAQH/MB0GA1UdDgQWBBQPA6nWBdIzpaLGXrwAK/7BywHxfzAK
  BggqhkjOPQQDAgNIADBFAiAqQsWCyR89x9zOhJ+2gWEBDEcWRVkcfc+rYYuPVQDo
  cgIhAPoIHcIx/+8VDaNFmE7EtKWzB9EcqE+nTpdwX/tcwIqv
  -----END CERTIFICATE-----

aperture:
  baseUrl: http://ai.taild13083.ts.net/v1
  # Aperture's tailnet IP, pinned via hostAliases (Constraint A — the tailscale
  # sidecar shares pod routes but not /etc/resolv.conf, so this name doesn't
  # resolve in-pod). `tailscale status` on the `ai` device.
  tailnetIp: 100.126.29.31

tailscale:
  image: tailscale/tailscale
  tag: ""
  hostname: hermes-aperture
  stateSecretName: hermes-tailscale-state

# API_SERVER_KEY, the tailscale auth key and the state-export deploy key are real credentials — they ship only
# as SealedSecret ciphertext (templates/sealedsecret.yaml), never plaintext here.
# Populated at deploy time via `kubeseal`.
sealedSecret:
  encryptedApiServerKey: ""
  encryptedTsAuthKey: ""
  # Write deploy key for stateExport.remote; mounted only into the state-export sidecar.
  encryptedStateExportSshKey: ""

# Infisical Agent Vault proxy (homekube spec 010). Off while encryptedHttpsProxy is empty.
agentVault:
  # encryptedData.HTTPS_PROXY of SealedSecret hermes-agent-vault in `namespace`, strict scope.
  encryptedHttpsProxy: ""
  # Proxy CA PEM, from its /_agent-vault/ca endpoint. Required with encryptedHttpsProxy.
  caCert: ""
  # httpx and urllib ignore CIDR entries.
  noProxy:
    - .svc
    - .cluster.local
    - .ts.net
    - 10.0.0.0/8
    - 100.64.0.0/10
    - 192.168.86.0/24
    - localhost
    - 127.0.0.1

# Read-only export of allowlisted Hermes state to a private repo (openspec state-export).
stateExport:
  remote: git@github.com:jangroth/herminator-state.git
  branch: main
  intervalSeconds: 3600
  # Relative to /opt/data. Under skills/, entries starting with "." are skipped.
  # Each top-level entry of /opt/data is export (first component of a path),
  # ignore (matches a pattern) or unclassified; the README lists all three.
  paths:
    - path: config.yaml
      description: Hermes configuration
    - path: SOUL.md
      description: persona and standing instructions
    - path: memories
      description: long-term memory files
    - path: cron/jobs.json
      description: cron job definitions
    - path: scripts
      description: scripts Hermes wrote
    - path: skills
      description: bundled, installed and created skills
    - path: morning-briefing
      description: output of the morning-briefing cron job
    - path: nvim-tips
      description: output of the nvim-tips cron job
    - path: package-manifest
      description: output of the package-manifest-watchdog cron job; packages installed outside the image
    - path: hooks
      description: user-defined hooks
    - path: plugins
      description: user-installed plugins
    - path: skins
      description: user-defined skins
    - path: plans
      description: plans Hermes wrote
  # Globs over top-level names; "*" also matches a leading ".".
  ignore:
    - reason: credentials and tokens
      patterns: [.env, auth.json, shared, pairing]
    - reason: CLI input history; may hold pasted secrets
      patterns: [.hermes_history]
    - reason: conversation transcripts and runtime databases
      patterns: [sessions, "*.db", "*.db-*"]
    - reason: process coordination
      patterns: ["*.lock", "*.pid", "*.sock"]
    - reason: regenerable caches
      patterns: ["*cache*"]
    - reason: logs, including kanban task-run logs and workspaces
      patterns: [logs, "*.log", kanban]
    - reason: installed tools and packages; package-manifest documents them
      patterns: [home, .local, lazy-packages, bin, installs]
    - reason: runtime state
      patterns: [state, runtime, pending, pending_messages, telemetry, plugin-update-checks, gateway_state.json, channel_directory.json, spawn-ledger.json, "telegram_update_receipts_*", install_id, tui-theme-boot.json, .scratch_tip_shown, .skills_prompt_snapshot.json]
    - reason: copies of exported files; git history covers them
      patterns: [backups, .curator_backups]
    - reason: generated binary images
      patterns: [images]
    - reason: stale scratch from August 2026
      patterns: [briefing, .hermes]
    - reason: empty or filesystem-managed
      patterns: [desktop, platforms, sandboxes, workspace, lost+found]
  betterleaks:
    image: ghcr.io/betterleaks/betterleaks
    tag: ""
  # Container port only; not on any Service.
  metricsPort: 9464
  # PodMonitor + PrometheusRule; needs the prometheus-operator CRDs.
  alerting:
    enabled: true
    staleAfterHours: 12

persistence:
  size: 5Gi
  storageClass: longhorn

resources:
  hermes:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  nginx:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  tailscale:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  stateExport:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
